spring:
  application:
    name: paging-and-filtering
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        generate_statistics: true
        default_batch_fetch_size: 50
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        serialization-mode: via_dto
logging:
  level:
    org.hibernate.SQL: DEBUG